<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="Description" content="Shopping list">
        <meta name="viewport" content="width=device-width">
        <title>Shopping List</title>
        <link rel="stylesheet" type="text/css" href="./static/css/index.css">
        <script type="module" src="./static/js/index.js"></script>
        <!-- icons and manifest for PWA -->
        <link rel="manifest" href="/static/manifest.json">
        <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
        <meta name="theme-color" content="#3c3836"/>
    </head>
    <body>

        <section id="header">
            <h1>Shopping List</h1>
            <button type="button" id="settings">
                <img src="./static/img/settings.svg" alt="Open settings">
            </button>
        </section>

        <section id="list">
        </section>

        <!--
        <button id="bundle">
            <img src="./static/img/bundle.svg" alt="New bundle">
        </button>
        -->
        <div class="fab-buttons">
            <button class="fab" id="clear">
                <img src="./static/img/cart.svg" alt="Clear checked items.">
            </button>
            <button class="fab" id="add">
                <img src="./static/img/add.svg" alt="Add new item.">
            </button>
        </div>

        <dialog id="edit-item-dialog">
            <form method="dialog">
                <div class="edit-input">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="off" value="">
                </div>
                <div class="edit-input-dual">
                    <div class="edit-input">
                        <label for="quantity">Quantity</label>
                        <input type="text" inputmode="numeric" id="quantity" name="quantity" autocomplete="off" value="">
                    </div>
                    <div class="edit-input">
                        <label for="units">Unit</label>
                        <select id="units" name="units">
                            <option value=""></option>
                            <option value="g">g</option>
                            <option value="kg">kg</option>
                            <option value="ml">ml</option>
                            <option value="L">L</option>
                        </select>
                    </div>
                </div>
                <div class="edit-input">
                    <label for="notes">Notes</label>
                    <input type="text" id="notes" name="notes" autocomplete="off" value="">
                </div>
                <div class="edit-input">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="Uncategorized"></option>
                        <option value="Fresh Fruits & Vegetables">Fresh Fruits & Vegetables</option>
                        <option value="Meat & Fish">Meat & Fish</option>
                        <option value="Refrigerated">Refrigerated</option>
                        <option value="Rice & Pasta">Rice & Pasta</option>
                        <option value="Dried, Canned, Jarred">Dried, Canned, Jarred</option>
                        <option value="Medicine">Medicine</option>
                        <option value="Ingredients & Spices">Ingredients & Spices</option>
                        <option value="Other Food Items">Other Food Items</option>
                        <option value="Snacks & Beverages">Snacks & Beverages</option>
                        <option value="Bread & Pastries">Bread & Pastries</option>
                        <option value="Frozen">Frozen</option>
                        <option value="Non-Food Items">Non-Food Items</option>
                    </select>
                </div>

                <div class="buttons">
                    <div>
                        <button type="submit" value="delete">Delete</button>    
                    </div>
                    <div>
                        <button type="submit" value="cancel">Cancel</button>
                        <button type="submit" value="submit">Save</button>
                    </div>
                </div>
            </form>
        </dialog>

        <dialog id="new-item-dialog">
            <form method="dialog">
                <div>
                    <input type="text" id="name" name="name" autocomplete="off" value="">
                    <button type="submit" value="submit">+</button>
                </div>
                <ul id="suggestions"></ul>
            </form>
        </dialog>

        <dialog id="settings-dialog">
            <form method="dialog">
                <h3>Settings</h3>
                <div class="setting-btns">
                    <button type="button" class="setting-btn" id="download-catalog">
                        <img src="./static/img/download.svg" alt="Download catalog">
                        Catalog
                    </button>
                    <button type="button" class="setting-btn" id="wakelock" disabled>
                        <img src="./static/img/display.svg" alt="Keep awake">
                        Awake
                    </button>
                </div>
                <div class="buttons">
                    <button type="submit" value="submit">Close</button>
                </div>
            </form>
        </dialog>

    </body>
</html>
